<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PTIT Trang chủ</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--red:#E2261C;--red-ink:#D41F16;--navy:#0A1A50;--ink:#373D4E;--muted:#646880;--faint:#9AA0B4;--line:#E6E8F0;--bg:#EEF1F8;
  --ease:cubic-bezier(.22,1,.36,1);--sans:"Be Vietnam Pro",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;--gut:clamp(32px,4vw,80px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#EEF1F8}}
:root[data-theme="dark"]{--bg:#EEF1F8}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none;cursor:pointer}
.nav{position:fixed;inset:0 0 auto 0;z-index:30;height:76px;display:flex;align-items:center;gap:40px;padding:0 var(--gut)}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:36px;height:36px;border-radius:10px;background:#fff;padding:4px}
.brand b{color:var(--red-ink);font-weight:900;font-size:20px}
.links{display:flex;gap:30px;font-size:15.5px;color:var(--navy)}.links .on{color:var(--red-ink);font-weight:800}
.right{margin-left:auto;display:flex;gap:10px;align-items:center}
.stats{display:flex;gap:9px;align-items:center;height:38px;padding:0 13px;border-radius:999px;background:rgba(255,255,255,.85);font:700 13.5px var(--mono);color:var(--navy)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800}

.track{height:500vh}
.stage{position:sticky;top:0;height:100vh;overflow:hidden}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,#DCE6F7 0%,#F3F5FB 55%,#FFFFFF 100%);transition:background 1s}
body.dusk .sky{background:linear-gradient(180deg,#141E52 0%,#3A2F6B 50%,#E8806A 100%)}
/* giant word: solid, readable, sits behind the tower */
.word{position:absolute;left:0;right:0;top:9vh;z-index:1;text-align:center;white-space:nowrap;font-weight:900;letter-spacing:-.04em;line-height:1.15;
  font-size:var(--ws);color:var(--wc);opacity:0;transform:translateY(6vh);transition:opacity .8s var(--ease),transform 1.1s var(--ease)}
.word.on{opacity:1;transform:none}
canvas#gl{position:absolute;inset:0;z-index:2;width:100%;height:100%}
/* foreground card: separates text + CTA from the busy scene */
.card{position:absolute;z-index:5;left:50%;bottom:6vh;width:min(640px,calc(100vw - 48px));transform:translateX(-50%);padding:22px 24px 22px 28px;border-radius:26px;
  background:rgba(255,255,255,.78);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid rgba(255,255,255,.95);box-shadow:0 30px 60px -30px rgba(10,26,80,.55);
  display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;transition:opacity .4s}
.card .ix{font:700 12px var(--mono);color:var(--red-ink)}
.card h2{margin:6px 0 0;font-size:24px;line-height:1.2;font-weight:900;letter-spacing:-.02em;color:var(--navy)}
.card h2 em{font-style:normal;color:var(--red-ink)}
.cta{display:inline-flex;align-items:center;gap:12px;height:58px;padding:0 10px 0 24px;border-radius:999px;color:#fff;font-weight:800;font-size:16.5px;white-space:nowrap;
  background:linear-gradient(150deg,#FF5A47,#E2261C 55%,#C81B12);box-shadow:0 16px 30px -14px rgba(226,38,28,.9);transition:transform .3s var(--ease)}
.cta span{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--red);display:grid;place-items:center;font-size:18px;transition:transform .3s var(--ease)}
.cta:hover{transform:translateY(-2px)}.cta:hover span{transform:translateX(4px)}
.swap{transition:opacity .35s}.swap.out{opacity:0}
.count{position:absolute;z-index:5;right:var(--gut);bottom:7vh;text-align:right;font:700 13px var(--mono);color:var(--navy);opacity:.7}
.count b{display:block;font:900 56px var(--sans);letter-spacing:-.05em;line-height:1}
body.dusk .count,body.dusk .nav .links,body.dusk .nav{color:#fff}
.hint{position:absolute;z-index:5;left:50%;top:calc(100vh - 3vh);transform:translate(-50%,-100%);font:700 11px var(--mono);color:var(--faint);letter-spacing:.24em}

.word{text-align:var(--wa,center);padding:0 var(--gut)}
.panel{position:absolute;z-index:5;top:50%;width:min(560px,42vw);opacity:0;transform:translateY(calc(-50% + 30px));transition:opacity .5s var(--ease),transform .8s var(--ease);pointer-events:none;
  padding:30px 32px;border-radius:28px;background:rgba(255,255,255,.8);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid rgba(255,255,255,.95);box-shadow:0 30px 60px -30px rgba(10,26,80,.55)}
.panel.on{opacity:1;transform:translateY(-50%);pointer-events:auto;transition-delay:.25s}
.panel.r{right:var(--gut)}.panel.l{left:var(--gut)}
.panel .ix{font:700 12px var(--mono);color:var(--red-ink)}
.panel h2{margin:8px 0 0;font-size:clamp(28px,2.4vw,40px);line-height:1.12;font-weight:900;letter-spacing:-.03em;color:var(--navy)}
.panel h2 em{font-style:normal;color:var(--red-ink)}
.panel ul{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.panel li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;font-size:16px;color:var(--ink);font-weight:500}
.panel li i{width:30px;height:30px;border-radius:9px;background:#FFF1EF;color:var(--red-ink);display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:800}
.panel .cta{margin-top:24px}
.card{transition:opacity .5s var(--ease)}.card.off{opacity:0;pointer-events:none}
body.dusk .panel{background:rgba(20,24,60,.62);border-color:rgba(255,255,255,.2)}
body.dusk .panel h2{color:#fff}body.dusk .panel li{color:#E3E6F5}body.dusk .panel li i{background:rgba(255,177,153,.18);color:#FFB199}body.dusk .panel .ix{color:#FFB199}

.word.side{top:10vh;letter-spacing:-.05em;background:linear-gradient(170deg,#FF5A47 0%,var(--wc) 38%,rgba(244,135,143,.55) 72%,rgba(255,220,215,.08) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.word.side.r{left:38%;right:var(--gut);text-align:right;padding:0}
.word.side.l{left:var(--gut);right:38%;text-align:left;padding:0}
.count{bottom:3vh}
.panel{top:auto;bottom:13vh;transform:translateY(30px)}.panel.on{transform:none}

/* word boxes per position; font-size is fitted by JS so nothing is cut */
.word.side{left:auto;right:auto;padding:0;text-align:left;white-space:nowrap}
.word.p-tr{top:12vh;left:40%;right:var(--gut);text-align:right}
.word.p-bl{top:auto;bottom:6vh;left:var(--gut);right:44%}
.word.p-bl{z-index:3}
.word.p-tl{z-index:3;top:10vh;left:var(--gut);right:46%;text-align:left}
.word.p-tc{top:10vh;left:var(--gut);right:var(--gut);text-align:center}
.panel.tl{left:var(--gut);top:14vh;bottom:auto;transform:translateY(30px)}.panel.tl.on{transform:none}
.panel.bc{left:50%;right:auto;bottom:5vh;width:min(1040px,calc(100vw - 2*var(--gut)));display:grid;grid-template-columns:auto 1fr auto;column-gap:36px;align-items:center;transform:translate(-50%,30px)}
.panel.bc.on{transform:translate(-50%,0)}
.panel.bc h2{font-size:26px;margin:4px 0 0;white-space:nowrap;grid-column:1;grid-row:2}
.panel.bc .ix{grid-column:1;grid-row:1}.panel.bc ul{grid-column:2;grid-row:1/3}.panel.bc .cta{grid-column:3;grid-row:1/3}
.panel.bc ul{flex-direction:row;flex-wrap:wrap;gap:10px 20px;margin:0}
.panel.bc li{grid-template-columns:28px auto;font-size:15px}
.panel.bc .cta{margin:0}
</style></head>
<body>
<header class="nav">
  <span class="brand"><img src="ptit-logo.webp" alt=""><b>PTIT</b></span>
  <nav class="links"><span class="on">Trang chủ</span><span>Ôn tập</span><span>Học phần</span><span>Studio 3D</span><span>Tiến độ &amp; Kỹ năng</span></nav>
  <span class="right"><span class="stats"><span style="color:#D41F16">12</span>·2.480 XP</span><span class="avatar">P</span></span>
</header>
<div class="track" id="track"><div class="stage">
  <div class="sky"></div>
  <div id="words"></div>
  <canvas id="gl"></canvas>
  <div class="card"><div class="swap" id="txt"><div class="ix" id="ix"></div><h2 id="h"></h2></div><a class="cta swap" id="cta"><b id="ctaT"></b><span>→</span></a></div>
  <div class="count"><b id="cn">01</b>/ 05</div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const C=[
 {w:'PTIT',ws:'34vw',wc:'#0A1A50',side:'c',ix:'Học viện PTIT',h:'Học bài giảng của thầy cô, cùng <em>trợ giảng AI</em>.',cta:'Học tiếp',cam:[0,1.2,35],tg:[0,15.5,0],off:0},
 // 1: góc thấp, tòa sát mép trái; chữ trên phải, thẻ dưới phải
 {w:'HỌC PHẦN',wc:'#E2261C',wp:'tr',side:'r',ix:'Học phần',h:'Học theo <em>bài giảng thật</em>.',items:[['▶','Video tự dừng để hỏi bạn'],['✦','Trợ giảng AI trả lời kèm mốc video'],['✓','Kiểm tra nhanh sau mỗi bài'],['★','Kiểm tra cuối khóa']],cta:'Vào Học phần',cam:[-12,1.5,40],tg:[0,14.5,0],off:.43},
 // 2: nhìn từ trên cao xuống, mô hình dưới phải; chữ dưới trái to, thẻ trên trái
 {w:'ÔN TẬP',wc:'#C81B12',wp:'bl',side:'tl',ix:'Ôn tập',h:'Ôn đúng <em>chỗ bạn hổng</em>.',items:[['✦','AI biến câu sai thành bài đọc ngắn'],['3','Mỗi ngày mở 3 bài, thêm bài bằng XP'],['✓','Đọc xong trả lời đúng mới tính']],cta:'Mở Ôn tập',cam:[22,42,34],tg:[2,6,0],off:-.26},
 // 3: hoàng hôn, cận sát chân tòa nhìn ngược lên, tòa bên phải; chữ chạy ngang trên cùng (tòa đè lên), thẻ dưới trái
 {w:'STUDIO 3D',wc:'#FF6A55',wp:'tl',side:'l',ix:'Studio 3D',h:'Thực hành <em>nhiếp ảnh</em> trong 3D.',items:[['✦','Gõ một câu, AI dựng đèn'],['◎','Chụp ảnh, AI chấm điểm và khoanh lỗi'],['↺','Bấm “Thử” để áp gợi ý sửa ngay']],cta:'Vào Studio',cam:[7,.4,22],tg:[0,17,0],off:-.3,dusk:1},
 // 4: kết, mô hình nhỏ ở giữa nhìn toàn cảnh; chữ phía sau, thẻ ngang dưới cùng
 {w:'TIẾN ĐỘ',wc:'#D41F16',wp:'tc',side:'bc',ix:'Tiến độ & Kỹ năng',h:'Thấy rõ <em>mình đã vững gì</em>.',items:[['◆','Bản đồ kỹ năng'],['XP','Lên cấp'],['12','Chuỗi ngày học'],['★','Huy hiệu']],cta:'Xem tiến độ',cam:[60,46,84],tg:[0,17,0],off:0},
];
const W=document.getElementById('words');
C.forEach(c=>{W.insertAdjacentHTML('beforeend',`<div class="word${c.side!=='c'?' side p-'+c.wp:''}" style="--ws:${c.ws};--wc:${c.wc};--wa:${c.wa||'center'}"><span style="display:inline-block">${c.w}</span></div>`);
  if(c.side!=='c')document.querySelector('.stage').insertAdjacentHTML('beforeend',`<div class="panel ${c.side}"><div class="ix">${c.ix}</div><h2>${c.h}</h2><ul>${c.items.map(([a,t])=>`<li><i>${a}</i>${t}</li>`).join('')}</ul><a class="cta"><b>${c.cta}</b><span>→</span></a></div>`)});

/* ---------- 3D: low-poly A2 + neighbours, worm's-eye camera ---------- */
function fit(){document.querySelectorAll('.word.side').forEach(e=>{const sp=e.firstElementChild;e.style.fontSize='100px';const box=e.clientWidth,w=sp.offsetWidth;e.style.fontSize=Math.min(100*box/w*0.97, innerHeight*.24)+'px'})}
addEventListener('resize',fit);document.fonts.ready.then(fit);fit();
const cv=document.getElementById('gl');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R.setPixelRatio(Math.min(2,devicePixelRatio));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const S=new THREE.Scene();S.fog=new THREE.Fog(0xEEF1F8,60,140);
const cam=new THREE.PerspectiveCamera(48,1,.1,300);
const hemi=new THREE.HemisphereLight(0xffffff,0xb8c2dc,.9);S.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,.9);sun.position.set(-20,40,25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-40,right:40,top:40,bottom:-40,near:1,far:120});S.add(sun);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85,metalness:0},o));
function facade(cols,rows,win='#4AA0DC',wall='#F7F8FB',lit=0){const c=document.createElement('canvas');c.width=cols*32;c.height=rows*40;const g=c.getContext('2d');
  g.fillStyle=wall;g.fillRect(0,0,c.width,c.height);for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){g.fillStyle=lit&&Math.random()<.45?'#FFD27A':(Math.random()<.08?'#F2D27A':win);g.fillRect(x*32+7,y*40+8,18,24)}
  const t=new THREE.CanvasTexture(c);t.anisotropy=8;return t}
const winMats=[];
function block(w,h,d,x,z,cols,rows,opt={}){const tex=facade(cols,rows,opt.win,opt.wall),lt=facade(cols,rows,'#2B3561',opt.wall?'#2A3155':'#262C4E',1);
  const side=M(0xffffff,{map:tex}),top=M(opt.roof||0xE9EDF5);side.userData={day:tex,night:lt};winMats.push(side);
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[side,side,top,top,side,side]);m.position.set(x,h/2,z);m.castShadow=m.receiveShadow=true;S.add(m);
  const trim=new THREE.Mesh(new THREE.BoxGeometry(w+.3,.35,d+.3),M(opt.trim||0xE2564C));trim.position.set(x,h+.17,z);S.add(trim);return m}
// ground
const gr=new THREE.Mesh(new THREE.PlaneGeometry(400,400),M(0xE4E8F1));gr.rotation.x=-Math.PI/2;gr.receiveShadow=true;S.add(gr);
// A2 tower
block(7,26,6,0,0,7,22);
const strip=new THREE.Mesh(new THREE.BoxGeometry(1.8,24,.4),M(0x8EEAD9,{emissive:0x2EC3A8,emissiveIntensity:.15}));strip.position.set(0,12.5,3.15);S.add(strip);
const sign=new THREE.Mesh(new THREE.BoxGeometry(1.8,1.1,.5),M(0xffffff));sign.position.set(0,23.6,3.2);S.add(sign);
const roof=new THREE.Mesh(new THREE.BoxGeometry(6,1.4,5),M(0xEEF1F7));roof.position.set(0,26.9,0);roof.castShadow=true;S.add(roof);
// clock
const clk=new THREE.Group();clk.position.set(0,27.4,3.2);S.add(clk);
const rim=new THREE.Mesh(new THREE.CylinderGeometry(1.7,1.7,.5,48),M(0x2EC3A8));rim.rotation.x=Math.PI/2;clk.add(rim);
const face=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.4,.55,48),M(0xffffff));face.rotation.x=Math.PI/2;clk.add(face);
const hand=(l,r)=>{const h=new THREE.Mesh(new THREE.BoxGeometry(.14,l,.1),M(0x0A1A50));h.geometry.translate(0,l/2,0);h.position.z=.32;h.rotation.z=r;clk.add(h);return h};
const hh=hand(.8,0),mh=hand(1.1,-1.6);
const ant=new THREE.Mesh(new THREE.CylinderGeometry(.08,.12,7,8),M(0x6B7088));ant.position.set(0,31,0);S.add(ant);
const tip=new THREE.Mesh(new THREE.SphereGeometry(.25,12,12),M(0xE2261C,{emissive:0xE2261C,emissiveIntensity:.8}));tip.position.set(0,34.6,0);S.add(tip);
// wings and neighbours
block(4,22,5,-5.4,-.6,4,19,{});block(4,22,5,5.4,-.6,4,19,{});
block(12,10,9,-16,2,10,7,{win:'#7EC0EE'});             // A1 trái
block(12,9,9,16,1,10,6,{win:'#5BA9E0',trim:0xE9C94A}); // A3 phải
block(30,5,8,0,9,24,3,{win:'#5FA8E6',wall:'#2B3A87',roof:0xDDE3EF}); // sảnh trước (xanh navy)
// trees
const tm=M(0x7FD39A,{flatShading:true}),tk=M(0x8A6A4A);
for(const [x,z,s] of [[-11,15,1.4],[-7,17,1.1],[9,16,1.3],[13,14,1],[-20,12,1.2],[20,12,1.3],[3,18,.9]]){const t=new THREE.Mesh(new THREE.IcosahedronGeometry(1.6*s,0),tm);t.position.set(x,2.6*s,z);t.castShadow=true;S.add(t);const k=new THREE.Mesh(new THREE.CylinderGeometry(.2,.25,1.6*s,6),tk);k.position.set(x,.8*s,z);S.add(k)}
// clouds
const cm=M(0xffffff,{flatShading:true});const clouds=[];
for(const [x,y,z] of [[-22,30,-10],[24,34,-14],[-30,24,-30],[30,26,-24]]){const g=new THREE.Group();for(let i=0;i<3;i++){const b=new THREE.Mesh(new THREE.IcosahedronGeometry(2.2-i*.4,0),cm);b.position.set(i*2.2,i%2*.6,0);g.add(b)}g.position.set(x,y,z);S.add(g);clouds.push(g)}

function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();

/* ---------- scroll → camera ---------- */
const track=document.getElementById('track');const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const L=(a,b,t)=>a+(b-a)*t,LV=(a,b,t)=>a.map((v,i)=>L(v,b[i],t));
let p=0,tp=0,cur=-1,mx=0,my=0;addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
const FREEZE=new URLSearchParams(location.search).get('p');if(FREEZE!==null){p=tp=+FREEZE}
const dayBg=new THREE.Color(0xEEF1F8),duskBg=new THREE.Color(0x3A2F6B);
function setChap(k){const c=C[k];document.querySelectorAll('.word').forEach((e,i)=>e.classList.toggle('on',i===k));
  const sw=document.querySelectorAll('.swap');sw.forEach(e=>e.classList.add('out'));
  setTimeout(()=>{document.getElementById('ix').textContent=c.ix;document.getElementById('h').innerHTML=c.h;document.getElementById('ctaT').textContent=c.cta;sw.forEach(e=>e.classList.remove('out'))},200);
  document.getElementById('cn').textContent='0'+(k+1);document.querySelector('.card').classList.toggle('off',k!==0);let pi=0;document.querySelectorAll('.panel').forEach((e,j)=>e.classList.toggle('on',j===k-1));document.body.classList.toggle('dusk',!!c.dusk);
  winMats.forEach(m=>{m.map=c.dusk?m.userData.night:m.userData.day;m.needsUpdate=true});}
function tick(t){
  if(FREEZE===null){const r=track.getBoundingClientRect();tp=Math.min(C.length-1,Math.max(0,-r.top/innerHeight))}
  p+=(tp-p)*.08;const i=Math.min(C.length-2,Math.floor(p)),f=ease(Math.min(1,p-i)),a=C[i],b=C[i+1];
  const pos=LV(a.cam,b.cam,f),tg=LV(a.tg,b.tg,f);
  const off=L(a.off,b.off,f);cam.setViewOffset(innerWidth,innerHeight,off*innerWidth,0,innerWidth,innerHeight);
  cam.position.set(pos[0]+mx*2.5,pos[1]-my*1.2,pos[2]);cam.lookAt(tg[0],tg[1],tg[2]);
  const d=L(a.dusk?1:0,b.dusk?1:0,f);
  hemi.intensity=L(.9,.35,d);sun.intensity=L(.9,.25,d);sun.color.setHSL(L(0,.06,d),L(0,.8,d),L(1,.65,d));S.fog.color.copy(dayBg).lerp(duskBg,d);
  hh.rotation.z=-t/40000;mh.rotation.z=-t/3300;clouds.forEach((c,j)=>c.position.x+=Math.sin(t/4000+j)*.004);
  const k=Math.round(p);if(k!==cur){cur=k;setChap(k)}
  R.render(S,cam);requestAnimationFrame(tick)}
requestAnimationFrame(tick);
</script>
</body></html>
