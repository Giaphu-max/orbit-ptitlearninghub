<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B1408"/><stop offset=".6" stop-color="#140B07"/><stop offset="1" stop-color="#0A0605"/></linearGradient>
<linearGradient id="key" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC56B" stop-opacity=".55"/><stop offset="1" stop-color="#FFC56B" stop-opacity="0"/></linearGradient>
<linearGradient id="fill" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FC4FF" stop-opacity=".22"/><stop offset="1" stop-color="#9FC4FF" stop-opacity="0"/></linearGradient>
<radialGradient id="ball" cx=".32" cy=".3" r=".8"><stop offset="0" stop-color="#FFE3B0"/><stop offset=".35" stop-color="#E9963A"/><stop offset=".75" stop-color="#6B2F10"/><stop offset="1" stop-color="#2A1206"/></radialGradient>
<radialGradient id="rim" cx=".42" cy=".4" r=".62"><stop offset=".78" stop-color="#FF6A4E" stop-opacity="0"/><stop offset=".86" stop-color="#FF7A55" stop-opacity=".85"/><stop offset=".9" stop-color="#FF7A55" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter><filter id="soft2"><feGaussianBlur stdDeviation="30"/></filter>
<radialGradient id="shadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".6"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<radialGradient id="hot" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF4DA"/><stop offset=".3" stop-color="#FFC56B" stop-opacity=".8"/><stop offset="1" stop-color="#FFC56B" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="560" fill="url(#bg)"/>
<!-- floor -->
<path d="M0 430 C 300 400, 900 400, 1280 430 L1280 560 L0 560Z" fill="#1E120B"/>
<!-- key light cone from top-left -->
<path d="M150 40 L640 250 L470 470 Z" fill="url(#key)" filter="url(#soft)"/>
<circle cx="150" cy="40" r="70" fill="url(#hot)"/>
<rect x="118" y="20" width="64" height="40" rx="8" fill="#2A1A10" stroke="#FFC56B" stroke-opacity=".6" transform="rotate(30 150 40)"/>
<!-- fill light from right -->
<path d="M830 40 L600 260 L700 440 Z" fill="url(#fill)" filter="url(#soft)"/>
<rect x="806" y="24" width="48" height="30" rx="6" fill="#1A1414" stroke="#9FC4FF" stroke-opacity=".5" transform="rotate(-40 830 40)"/>
<!-- subject -->
<ellipse cx="540" cy="452" rx="150" ry="22" fill="url(#shadow)"/>
<circle cx="540" cy="330" r="118" fill="url(#ball)"/>
<path d="M570.3 217.0 A117 117 0 0 1 649.9 370.0" fill="none" stroke="#FFB08A" stroke-width="4" stroke-linecap="round" opacity=".9"/><path d="M570.3 217.0 A117 117 0 0 1 649.9 370.0" fill="none" stroke="#FF6A4E" stroke-width="14" stroke-linecap="round" opacity=".35" filter="url(#soft)"/>
<circle cx="560" cy="300" r="170" fill="#FFC56B" opacity=".08" filter="url(#soft2)"/>
<!-- aperture -->
<circle cx="1010" cy="260" r="190" fill="none" stroke="#F6D7A8" stroke-opacity=".45" stroke-width="2"/>
<circle cx="1010" cy="260" r="216" fill="none" stroke="#F6D7A8" stroke-opacity=".15" stroke-width="12" stroke-dasharray="2 10"/>
<path d="M1193.5 309.2 L1059.2 443.5 L1065.3 306.4Z" fill="none" stroke="#F6D7A8" stroke-opacity=".35" stroke-width="2"/><path d="M1059.2 443.5 L875.6 394.4 L997.5 331.1Z" fill="none" stroke="#F6D7A8" stroke-opacity=".35" stroke-width="2"/><path d="M875.6 394.4 L826.5 210.8 L942.2 284.7Z" fill="none" stroke="#F6D7A8" stroke-opacity=".35" stroke-width="2"/><path d="M826.5 210.8 L960.8 76.5 L954.7 213.6Z" fill="none" stroke="#F6D7A8" stroke-opacity=".35" stroke-width="2"/><path d="M960.8 76.5 L1144.4 125.6 L1022.5 188.9Z" fill="none" stroke="#F6D7A8" stroke-opacity=".35" stroke-width="2"/><path d="M1144.4 125.6 L1193.5 309.2 L1077.8 235.3Z" fill="none" stroke="#F6D7A8" stroke-opacity=".35" stroke-width="2"/>
<circle cx="1010" cy="260" r="68.39999999999999" fill="#FFC56B" fill-opacity=".12"/>
<!-- thirds grid hint -->
<g stroke="#F6D7A8" stroke-opacity=".12"><path d="M426.6666666666667 0V560M853.3333333333334 0V560M0 186.66666666666666H1280M0 373.3333333333333H1280"/></g>
</svg>